version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      AI_API_KEY: ${AI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-your_secret_key}
    restart: unless-stopped